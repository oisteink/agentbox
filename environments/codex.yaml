# Copy outside agent-writable projects, e.g. ~/.config/agentbox/environments/.
# Register project "example" and build image "codex" from its matching template.
# Export OPENAI_API_KEY on the host before abx start; never put the key here.
# API-key example; subscription login needs a separate network policy.
name: example-codex
image: codex
workdir: /workspace
command: ["codex"]
mounts:
  - project: example
    target: /workspace
    mode: rw
network:
  allow:
    - host: api.openai.com
      port: 443
credentials:
  - host: api.openai.com
    port: 443
    header: Authorization
    env: OPENAI_API_KEY
resources:
  cpus: 2
  memory: 4g
  pids: 512
