# Copy outside agent-writable mounts, e.g. ~/.config/agentbox/environments/.
# Register mount "example" and build image "claude-code" from its matching template.
# Export ANTHROPIC_API_KEY on the host before abx start; never put the key here.
# API-key example; subscription login needs a separate network policy.
name: example-claude-code
image: claude-code
workdir: /workspace
command: ["claude"]
mounts:
  - source: example
    target: /workspace
    mode: rw
network:
  allow:
    - host: api.anthropic.com
      port: 443
credentials:
  - host: api.anthropic.com
    port: 443
    header: x-api-key
    env: ANTHROPIC_API_KEY
resources:
  cpus: 2
  memory: 4g
  pids: 512
