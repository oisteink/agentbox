# Offline Bash environment. Register project "example" or change the mount below.
# For Codex with API token placeholders and an alias, see context7-codex.yaml.
name: example-dev
image: codex
workdir: /home/agent/src/example
command: ["bash"]
mounts:
  - project: example
    target: /home/agent/src/example
    mode: rw
network:
  allow: []
resources:
  cpus: 2
  memory: 4g
  pids: 512
