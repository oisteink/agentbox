# Copy outside agent-writable projects, e.g. ~/.config/agentbox/environments/.
# Change mounts[].project to a project registered with abx project add.
# Host: export context7_api_key with the raw API key (without Bearer).
# Agent: CONTEXT7_TOKEN gets a generated placeholder, or is empty if the source is missing/empty.
# Codex MCP: --bearer-token-env-var CONTEXT7_TOKEN
name: context7-codex
image: agentbox-dev:local
workdir: /workspace
command: ["codex"]
mounts:
  - project: example
    target: /workspace
    mode: rw
network:
  allow:
    - host: auth.openai.com
      port: 443
    - host: chatgpt.com
      port: 443
    - host: ab.chatgpt.com
      port: 443
    - host: mcp.context7.com
      port: 443
credentials:
  - host: mcp.context7.com
    port: 443
    header: Authorization
    # client variable = host source; names are case-sensitive.
    # Short form "CONTEXT7_TOKEN" reads that same name on the host.
    env: CONTEXT7_TOKEN=context7_api_key
resources:
  cpus: 2
  memory: 4g
  pids: 512
